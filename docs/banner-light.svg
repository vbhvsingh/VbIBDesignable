<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="VbIBDesignable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7fb"/><stop offset="1" stop-color="#e9ecf5"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A84FF"/><stop offset="1" stop-color="#F05138"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1020" flood-opacity=".18"/></filter>
    <style>
      .h{font:800 52px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#111827;letter-spacing:-1.5px}
      .s{font:500 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#4b5563}
      .m{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111827;opacity:.8}
      .chip{fill:none;stroke:#4b5563;stroke-opacity:.45}
    </style>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <text x="64" y="104" class="h">VbIBDesignable</text>
  <text x="64" y="140" class="s">Corner radius, border, shadow and gradients, live in Interface Builder.</text>
  <g transform="translate(64,172)">
    <rect class="chip" width="120" height="32" rx="16"/><text class="m" x="60" y="21" text-anchor="middle">Swift 5.9</text>
    <rect class="chip" x="132" width="96" height="32" rx="16"/><text class="m" x="180" y="21" text-anchor="middle">iOS 13+</text>
    <rect class="chip" x="240" width="104" height="32" rx="16"/><text class="m" x="292" y="21" text-anchor="middle">tvOS 13+</text>
    <rect class="chip" x="356" width="72" height="32" rx="16"/><text class="m" x="392" y="21" text-anchor="middle">SPM</text>
    <rect class="chip" x="440" width="66" height="32" rx="16"/><text class="m" x="473" y="21" text-anchor="middle">MIT</text>
  </g>
  <!-- three demo views -->
  <g filter="url(#sh)"><rect x="820" y="56" width="104" height="104" rx="26" fill="#ffffff"/></g>
  <rect x="948" y="56" width="104" height="104" rx="26" fill="#ffffff" stroke="#0A84FF" stroke-width="4"/>
  <rect x="1076" y="56" width="70" height="104" rx="26" fill="url(#acc)"/>
  <text x="872" y="196" class="m" text-anchor="middle">shadow</text>
  <text x="1000" y="196" class="m" text-anchor="middle">border</text>
  <text x="1111" y="196" class="m" text-anchor="middle">gradient</text>
</svg>
